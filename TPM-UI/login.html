<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSO Login - Çanakkale Fen Lisesi</title>
    <link rel="stylesheet" href="/sso-v2.css" />
    <meta name="theme-color" content="#fff" />
</head>

<body>
    <main>
        <div class="login-bg-limit">
            <img class="login-bg" src="/assets/hubert-neufeld-GG1CwF4qdlg-unsplash.jpg" />
        </div>
        <div class="login-box">

            <div class="login-page">
                <div class="branding">
                    <img class="svglogo" src="/assets/snowflake.svg" />
                    <div class="brand-texts">
                        <div class="school-name">Arctic</div>
                        <div class="sso-brand">Remote Attestation Security</div>
                    </div>
                </div>
                <div class="the-form">
                    <div class="lg-title"></div>
                    <div class="lg-appname"></div>
                    <div class="lg-text">
                        Use your login information to access Dashboard.
                    </div>
                </div>

                <div class="formd">
                    <input type="text" placeholder="Username" class="formd-txt uname" />
                    <input type="password" placeholder="Password" class="formd-txt pwd" />
                    <div class="action" style="display: inline-block">Log in</div>
                </div>

                <div class="legal-txt">
                    &copy; 2026 Yağızhan Işık<br />

                    <br />

                </div>
            </div>

        </div>
    </main>

</body>

</html>
